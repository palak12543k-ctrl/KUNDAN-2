    <meta charset="UTF-8">

    <!-- External CSS & Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            font-family: 'Poppins', sans-serif;
            box-sizing: border-box;
        }

        body {
            background-color: #030308;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        /* Animated Star Background */
        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            pointer-events: none;
        }

        /* Custom Glowing Card Boundary */
        .neon-card {
            background: rgba(10, 10, 18, 0.85);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(0, 240, 255, 0.5);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.3), inset 0 0 15px rgba(0, 240, 255, 0.2);
            position: relative;
            z-index: 10;
        }

        /* Neon Glow Rings */
        .glowing-circle {
            position: relative;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px #00f0ff, inset 0 0 20px #00f0ff, 0 0 35px #ff00ff;
            border: 3px solid #00f0ff;
            animation: pulseGlow 2.5s infinite alternate;
        }

        .glowing-circle-lg {
            width: 180px;
            height: 180px;
        }

        .glowing-circle-md {
            width: 140px;
            height: 140px;
            border-color: #00f0ff;
            box-shadow: 0 0 25px #00f0ff, inset 0 0 15px #00f0ff;
        }

        @keyframes pulseGlow {
            0% {
                box-shadow: 0 0 15px #00f0ff, inset 0 0 10px #00f0ff;
            }
            100% {
                box-shadow: 0 0 30px #00f0ff, 0 0 40px #ff00ff, inset 0 0 20px #ff00ff;
            }
        }

        /* Neon Buttons & Badges */
        .neon-badge {
            border: 2px solid #ff00ff;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.6), inset 0 0 10px rgba(255, 0, 255, 0.4);
            background: rgba(0, 0, 0, 0.7);
        }

        .join-btn {
            background: linear-gradient(90deg, #d946ef 0%, #a855f7 50%, #06b6d4 100%);
            box-shadow: 0 0 25px rgba(217, 70, 239, 0.8), 0 0 35px rgba(6, 182, 212, 0.6);
            transition: all 0.3s ease;
        }

        .join-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 0 35px rgba(217, 70, 239, 1), 0 0 45px rgba(6, 182, 212, 0.9);
        }

        .join-btn:active {
            transform: scale(0.98);
        }

        /* Dynamic Star Particle */
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: moveStar linear infinite;
        }

        @keyframes moveStar {
            from { transform: translateY(0); opacity: 1; }
            to { transform: translateY(100vh); opacity: 0; }
        }

<body class="min-h-screen flex items-center justify-center p-4 relative overflow-y-auto">

    <!-- Background Particle Canvas -->
    <div id="particles-js"></div>

    <main class="w-full max-w-md flex flex-col items-center justify-center my-auto z-10 py-6">
        
        <!-- Top Profile Avatar Circle -->
        <div class="glowing-circle glowing-circle-lg mb-6 bg-black flex items-center justify-center overflow-hidden">
            <i class="fa-solid fa-crown text-5xl text-cyan-400 drop-shadow-[0_0_10px_rgba(0,240,255,0.8)]"></i>
        </div>

        <!-- Central Neon Card Container -->
        <div class="neon-card w-full rounded-3xl p-6 sm:p-8 flex flex-col items-center text-center space-y-6">
            
            <!-- Page Title -->
            <h1 class="text-3xl font-extrabold text-white tracking-wide">
                playboymeeting
            </h1>

            <!-- Service Badge -->
            <div class="neon-badge px-6 py-2 rounded-2xl flex items-center justify-center space-x-2">
                <span class="text-white font-bold text-base sm:text-lg tracking-wide">Real service</span>
                <span class="text-xl">🔥</span>
            </div>

            <!-- Join Telegram Main Button -->
            <a href="https://t.me/+uECO1q_eLqJiMmRl" target="_blank" id="telegram-link" class="w-full block">
                <button class="join-btn w-full py-4 px-6 rounded-full text-white font-extrabold text-xl sm:text-2xl tracking-wider uppercase flex items-center justify-center gap-3 cursor-pointer border-none">
                    <i class="fa-brands fa-telegram text-2xl sm:text-3xl"></i>
                    JOIN TELEGRAM
                </button>
            </a>

            <!-- Countdown Timer Circle -->
            <div class="glowing-circle glowing-circle-md my-2 bg-black">
                <span id="counter" class="text-white text-3xl font-extrabold tracking-widest">
                    .15
                </span>
            </div>

            <!-- Auto Join Status Bar -->
            <div class="neon-badge w-full py-3 px-4 rounded-2xl">
                <p class="text-amber-300 font-semibold text-sm sm:text-base tracking-wide flex items-center justify-center gap-2 m-0">
                    Auto joining in <span id="sec-text" class="text-white font-bold">15</span> seconds...
                </p>
            </div>

        </div>

        <!-- Footer Copyright -->
        <p class="text-gray-400 text-xs mt-6 text-center tracking-wider">
            &copy; 2026 playboymeeting. All rights reserved.
        </p>

    </main>

    <script>
        const TELEGRAM_URL = "https://t.me/+uECO1q_eLqJiMmRl";
        let secondsLeft = 15;

        const counterElement = document.getElementById('counter');
        const secTextElement = document.getElementById('sec-text');

        // Dynamic Countdown and Auto-Redirect Logic
        const timer = setInterval(() => {
            secondsLeft--;

            if (secondsLeft < 10) {
                counterElement.innerText = `.0${secondsLeft}`;
            } else {
                counterElement.innerText = `.${secondsLeft}`;
            }

            secTextElement.innerText = secondsLeft;

            if (secondsLeft <= 0) {
                clearInterval(timer);
                counterElement.innerText = ".00";
                secTextElement.innerText = "0";
                
                // Redirect to target Telegram Link
                window.location.href = TELEGRAM_URL;
            }
        }, 1000);

        // Starfield Particle Generator
        function createStars() {
            const container = document.getElementById('particles-js');
            if (!container) return;
            
            const starCount = 80;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                
                const size = Math.random() * 3 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                
                star.style.left = `${Math.random() * 100}vw`;
                star.style.top = `${Math.random() * -20}px`;
                
                const duration = Math.random() * 5 + 3;
                star.style.animationDuration = `${duration}s`;
                star.style.animationDelay = `${Math.random() * 5}s`;
                
                container.appendChild(star);
            }
        }

        window.onload = function() {
            createStars();
        };
    </script>
